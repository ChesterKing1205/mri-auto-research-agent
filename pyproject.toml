[project]
name = "mri-auto-research-agent"
version = "0.1.0"
description = "Auto Research environment for fastMRI multicoil MRI reconstruction."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "h5py>=3.10",
    "numpy>=1.24",
    "pytorch-lightning>=2.2",
    "pyyaml>=6.0",
    "scikit-image>=0.22",
    "torch>=2.2",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
